# ═══════════════════════════════════════════════════════════════
# render.yaml — ERP System (Render + Supabase) — تحديث: 2026-09-19
# ═══════════════════════════════════════════════════════════════
# ملاحظات الخطة المجانية:
#   • خطة التطبيق: Free — تتوقف الخدمة بعد 15 دقيقة من عدم
#     النشاط، وقد يستغرق الاستيقاظ (Cold Start) ~50 ثانية عند أول طلب.
#   • قاعدة البيانات: Supabase (PostgreSQL) — DATABASE_URL يُعبأ يدوياً
#   • Cron Jobs: كل 3 أيام لمنع إيقاف Supabase المجاني (حد أقصى 7 أيام سكون)
#   • متغيرات المصادقة: AUTH_* (next-auth v5) — وليس NEXTAUTH_* (v4)
#
# ⚠️  ملاحظة مهمة حول AUTH_URL و NEXT_PUBLIC_APP_URL:
#   • بعد أول نشر ناجح والحصول على الرابط (مثل https://erp-system-xx.onrender.com)،
#     عدّل القيمتين يدوياً ليكونا = الرابط الكامل مع https://
#     ثم احفظ وانتظر إعادة التشغيل التلقائي للخدمة.
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # التطبيق الرئيسي — Web Service (Node.js Runtime)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: erp-system
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/db/migrations/run-migrations.cjs && (node src/db/seed-production.cjs || true) && npm start
    envVars:
      # ── 1. قاعدة البيانات (Supabase PostgreSQL) ──
      - key: DATABASE_URL
        value: postgresql://postgres:U0kJOCYez4WnIoDw@db.txlcfxfuiphwicpduccc.supabase.co:5432/postgres?sslmode=require

      # ── 2. إعدادات Node والإنتاج ──
      - key: NODE_ENV
        value: production

      # ── 3. المصادقة (next-auth v5) ──
      - key: AUTH_SECRET
        value: GIbjpeeN7i0iEBInnBXbarsPgxvVXjL4aLcnwrugnYU=
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"

      # ── 4. إعدادات التطبيق العامة ──
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: "نظام إدارة الموارد"

      # ── 5. تهيئة أولية للإنتاج (Seed — مستخدم المدير) ──
      - key: SEED_ADMIN_EMAIL
        value: admin@yourorg.com
      - key: SEED_ADMIN_PASSWORD
        value: "2ANRMNTWNPeyXr8w39iZW3EU!1A."

      # ── 6. البريد الإلكتروني / التنبيهات (اختياري — اتركها فارغة حالياً) ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECURITY_ALERT_EMAIL
        sync: false

      # ── 7. التخزين (S3/R2) — اختياري ──
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: erp-documents
      - key: STORAGE_REGION
        value: auto

      # ── 8. المراقبة (Sentry/PostHog) — اختياري ──
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false


  # ─────────────────────────────────────────────────────────────
  # Cron Job 1 — التحقق من سلامة سلسلة سجل التدقيق (audit:verify)
  # ─────────────────────────────────────────────────────────────
  # الجدول: كل 3 أيام عند الساعة 3:00 صباحاً UTC
  #      └─ قبل مهمة تسوية المخزون بـ 30 دقيقة
  - type: cron
    name: erp-audit-integrity-check
    runtime: node
    region: oregon
    plan: free
    schedule: "0 3 */3 * *"
    buildCommand: npm install
    startCommand: npm run audit:verify
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:U0kJOCYez4WnIoDw@db.txlcfxfuiphwicpduccc.supabase.co:5432/postgres?sslmode=require
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECURITY_ALERT_EMAIL
        sync: false


  # ─────────────────────────────────────────────────────────────
  # Cron Job 2 — تسوية أرصدة المخزون مقابل دفتر الحركات (stock:reconcile)
  # ─────────────────────────────────────────────────────────────
  # الجدول: كل 3 أيام عند الساعة 3:30 صباحاً UTC
  #      └─ بعد مهمة التدقيق بنصف ساعة
  - type: cron
    name: erp-stock-reconcile
    runtime: node
    region: oregon
    plan: free
    schedule: "30 3 */3 * *"
    buildCommand: npm install
    startCommand: npm run stock:reconcile
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:U0kJOCYez4WnIoDw@db.txlcfxfuiphwicpduccc.supabase.co:5432/postgres?sslmode=require
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECURITY_ALERT_EMAIL
        sync: false
