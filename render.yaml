# ═══════════════════════════════════════════════════════════════
# render.yaml — ERP System (Render + Supabase) — تحديث: 2026-09-19
# ═══════════════════════════════════════════════════════════════
# ملاحظات الخطة المجانية:
#   • خطة التطبيق: Free — تتوقف الخدمة بعد 15 دقيقة من عدم
#     النشاط، وقد يستغرق الاستيقاظ (Cold Start) ~50 ثانية عند أول طلب.
#   • قاعدة البيانات: Supabase (PostgreSQL) — DATABASE_URL يُعبأ يدوياً
#   • Cron Jobs: كل 3 أيام لمنع إيقاف Supabase المجاني (حد أقصى 7 أيام سكون)
#   • متغيرات المصادقة: AUTH_* (next-auth v5) — وليس NEXTAUTH_* (v4)
#
# ⚠️  ملاحظة مهمة حول AUTH_URL و NEXT_PUBLIC_APP_URL:
#   • بعد أول نشر ناجح والحصول على الرابط (مثل https://erp-system-xx.onrender.com)،
#     عدّل القيمتين يدوياً ليكونا = الرابط الكامل مع https://
#     ثم احفظ وانتظر إعادة التشغيل التلقائي للخدمة.
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # التطبيق الرئيسي — Web Service (Node.js Runtime)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: erp-system
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/db/migrations/run-migrations.cjs && (node src/db/seed-production.cjs || true) && npm start
    envVars:
      # ── 1. قاعدة البيانات (Supabase PostgreSQL) ──
      - key: DATABASE_URL
        value: "postgresql://postgres.txlcfxfuiphwicpduccc:U0kJOCYez4WnIoDw@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require&uselibpqcompat=true"

      # ── 2. إعدادات Node والإنتاج ──
      - key: NODE_ENV
        value: production

      # ── 3. المصادقة (next-auth v5) ──
      - key: AUTH_SECRET
        value: GIbjpeeN7i0iEBInnBXbarsPgxvVXjL4aLcnwrugnYU=
      - key: AUTH_URL
        value: "https://erp-system-eywi.onrender.com"
      - key: AUTH_TRUST_HOST
        value: "true"

      # ── 4. إعدادات التطبيق العامة ──
      - key: NEXT_PUBLIC_APP_URL
        value: "https://erp-system-eywi.onrender.com"
      - key: NEXT_PUBLIC_APP_NAME
        value: "نظام إدارة الموارد"

      # ── 5. تهيئة أولية للإنتاج (Seed — مستخدم المدير) ──
      - key: SEED_ADMIN_EMAIL
        value: admin@yourorg.com
      - key: SEED_ADMIN_PASSWORD
        value: "2ANRMNTWNPeyXr8w39iZW3EU!1A"

      # ── 6. البريد الإلكتروني / التنبيهات (اختياري — اتركها فارغة حالياً) ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SECURITY_ALERT_EMAIL
        sync: false

      # ── 7. المهام الدورية — سرّ حماية نقطة /api/cron/* ──
      # تُستدعى من Supabase pg_cron + pg_net (Render المجاني لا يدعم Cron Jobs)
      - key: CRON_SECRET
        value: "1ea4b36991904689a8927f19ef817129b32c45403ffd43ceb62c29f160affcd6"

      # ── 8. التخزين (S3/R2) — اختياري ──
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: erp-documents
      - key: STORAGE_REGION
        value: auto

      # ── 9. المراقبة (Sentry/PostHog) — اختياري ──
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false


  # ─────────────────────────────────────────────────────────────
  # المهام الدورية (Cron) — لا تُعرَّف هنا
  # ─────────────────────────────────────────────────────────────
  # Render يرفض خدمات type: cron على الخطة المجانية:
  #   "invalid plan: free. Valid PaidPlans are [starter, standard, pro, ...]"
  # البديل المجاني المُطبَّق فعلياً: pg_cron + pg_net داخل Supabase
  # يستدعيان (عبر HTTP) نقطة الحماية في التطبيق:
  #   POST https://erp-system-eywi.onrender.com/api/cron/audit-verify     — "0 3 */3 * *"
  #   POST https://erp-system-eywi.onrender.com/api/cron/stock-reconcile  — "30 3 */3 * *"
  # الترويسة المطلوبة: x-cron-secret = CRON_SECRET (أعلاه).
  # ملاحظة: عند استيقاظ الخدمة (Cold Start ~50 ث) تُمنح pg_net مهلة 120 ثانية.
  # ─────────────────────────────────────────────────────────────
